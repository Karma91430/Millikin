<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Millikin</title>
  <desc id="d">Run your projects with a team of agents. A board with tickets moving from to do to done.</desc>
  <style>
    .h { font-family: Geist, "Helvetica Neue", Arial, sans-serif; }
    .m { font-family: "Geist Mono", Menlo, monospace; }
  </style>
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="64" y="60" width="44" height="44" rx="10" fill="#18181b"/>
  <text x="86" y="90" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" class="h">M</text>
  <text x="124" y="91" font-size="26" font-weight="600" fill="#18181b" class="h">Millikin</text>
  <text x="64" y="176" font-size="54" font-weight="600" fill="#18181b" class="h" letter-spacing="-1.5">Run your projects with</text>
  <text x="64" y="240" font-size="54" font-weight="600" fill="#18181b" class="h" letter-spacing="-1.5">a team of agents.</text>
  <text x="64" y="288" font-size="22" fill="#52525b" class="h">Open source, self-hosted. Ollama, Claude Code, Codex or any API.</text>

  <rect x="64" y="330" width="1072" height="250" rx="14" fill="#0b0d12" stroke="#2a2f3a"/>
  <g class="h" font-size="15">
    <rect x="88" y="354" width="240" height="202" rx="10" fill="#11141b" stroke="#242a36"/>
    <text x="104" y="380" fill="#9aa3b5" font-size="13">To do</text>
    <rect x="100" y="394" width="216" height="58" rx="8" fill="#171b24" stroke="#242a36"/><text x="114" y="420" fill="#e6e8ee">Cache rates for one hour</text><text x="114" y="440" fill="#697287" font-size="12">3 pts</text>
    <rect x="348" y="354" width="240" height="202" rx="10" fill="#11141b" stroke="#242a36"/>
    <text x="364" y="380" fill="#9aa3b5" font-size="13">In progress</text>
    <rect x="360" y="394" width="216" height="76" rx="8" fill="#171b24" stroke="#242a36"/><text x="374" y="420" fill="#e6e8ee">Convert two currencies</text><circle cx="378" cy="453" r="3.5" fill="#7c6cf6"/><text x="388" y="457" fill="#7c6cf6" font-size="12">Developer is working</text>
    <rect x="608" y="354" width="240" height="202" rx="10" fill="#11141b" stroke="#242a36"/>
    <text x="624" y="380" fill="#9aa3b5" font-size="13">In review</text>
    <rect x="868" y="354" width="244" height="202" rx="10" fill="#11141b" stroke="#242a36"/>
    <text x="884" y="380" fill="#9aa3b5" font-size="13">Done</text>
    <rect x="880" y="394" width="220" height="58" rx="8" fill="#171b24" stroke="#242a36"/><text x="894" y="420" fill="#e6e8ee">Fetch daily rates</text><rect x="894" y="430" width="52" height="16" rx="4" fill="#10b98124"/><text x="900" y="442" fill="#34d399" font-size="11" class="m">✓ 4/5</text>
    <rect x="880" y="462" width="220" height="58" rx="8" fill="#171b24" stroke="#242a36"/><text x="894" y="488" fill="#e6e8ee">Error when API is down</text><rect x="894" y="498" width="52" height="16" rx="4" fill="#10b98124"/><text x="899" y="510" fill="#34d399" font-size="11" class="m">✓ auto</text>
  </g>
</svg>
