<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Millikin</title>
  <desc id="d">Agent teams that work like a team, on infrastructure you own. A schematic of a project lead and a tech lead handing tickets to a developer and a tester.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1c1b18" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <style>
      .serif { font-family: Newsreader, Georgia, "Times New Roman", serif; fill: #1c1b18; }
      .mono { font-family: "IBM Plex Mono", Menlo, monospace; fill: #807b70; }
      .box { fill: #fbf9f4; stroke: #4a4740; stroke-width: 1.2; }
      .live { fill: #fbf9f4; stroke: #c2410c; stroke-width: 2; }
      .edge { fill: none; stroke: #bdb4a2; stroke-width: 1.5; }
      .on { fill: none; stroke: #c2410c; stroke-width: 2.5; stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#f3efe6"/>
  <rect x="610" y="70" width="530" height="490" fill="#fbf9f4" stroke="#bdb4a2"/>
  <rect x="610" y="70" width="530" height="490" fill="url(#grid)"/>
  <line x1="610" y1="100" x2="1140" y2="100" stroke="#d8d1c2"/>
  <text x="626" y="90" font-size="13" class="mono">project · temperature-cli</text>
  <text x="1124" y="90" font-size="13" text-anchor="end" class="mono" style="fill:#c2410c">phase: build</text>

  <path d="M760 260 L 760 400" class="edge"/>
  <path d="M845 420 C 905 420, 905 250, 960 250" class="on"/>
  <path d="M845 420 C 905 420, 905 470, 960 470" class="edge"/>

  <rect x="670" y="220" width="180" height="50" class="box"/>
  <rect x="678" y="228" width="34" height="34" fill="none" stroke="#4a4740"/>
  <text x="695" y="250" font-size="12" text-anchor="middle" class="mono" style="fill:#1c1b18">PL</text>
  <text x="724" y="243" font-size="15" class="serif">Project lead</text>
  <text x="724" y="260" font-size="11" class="mono">first contact</text>

  <rect x="670" y="400" width="180" height="50" class="live"/>
  <rect x="678" y="408" width="34" height="34" fill="#c2410c"/>
  <text x="695" y="430" font-size="12" text-anchor="middle" class="mono" style="fill:#fffaf3">TL</text>
  <text x="724" y="423" font-size="15" class="serif">Tech lead</text>
  <text x="724" y="440" font-size="11" class="mono" style="fill:#c2410c">assigning</text>

  <rect x="960" y="225" width="160" height="50" class="live"/>
  <rect x="968" y="233" width="34" height="34" fill="#c2410c"/>
  <text x="985" y="255" font-size="11" text-anchor="middle" class="mono" style="fill:#fffaf3">DEV</text>
  <text x="1012" y="248" font-size="15" class="serif">Developer</text>
  <text x="1012" y="265" font-size="11" class="mono" style="fill:#c2410c">writing files</text>

  <rect x="960" y="445" width="160" height="50" class="box"/>
  <rect x="968" y="453" width="34" height="34" fill="none" stroke="#4a4740"/>
  <text x="985" y="475" font-size="12" text-anchor="middle" class="mono" style="fill:#1c1b18">QA</text>
  <text x="1012" y="468" font-size="15" class="serif">Tester</text>
  <text x="1012" y="485" font-size="11" class="mono">waiting</text>

  <rect x="880" y="330" width="150" height="24" fill="#fbf9f4" stroke="#3f6b45"/>
  <text x="890" y="347" font-size="12" class="mono" style="fill:#3f6b45">#1 checked ✓</text>

  <text x="60" y="110" font-size="14" class="mono" style="letter-spacing:2px">OPEN SOURCE · RUNS ON YOUR MACHINE</text>
  <text x="60" y="200" font-size="66" class="serif">Agent teams</text>
  <text x="60" y="272" font-size="66" class="serif">that work</text>
  <text x="60" y="344" font-size="66" font-style="italic" class="serif">like a team.</text>
  <rect x="60" y="384" width="120" height="4" fill="#c2410c"/>
  <text x="60" y="440" font-size="20" class="mono" style="fill:#4a4740">Millikin — your logic, any engine.</text>
  <text x="60" y="560" font-size="15" class="mono">Ollama · Claude Code · Codex · OpenAI-compatible · Anthropic</text>
